<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#166534">

  <title>POGA KSA - Member Registration</title>

  <link rel="stylesheet" href="registration.css">
</head>

<body>

  <div class="registration-container">

    <header class="registration-header">
      <div class="logo-circle">P</div>

      <h1>POGA KSA</h1>
      <p>Member Registration Form</p>
    </header>

    <section class="registration-card">

      <h2>Register as a Member</h2>
      <p class="subtitle">
        Please provide your information below.
      </p>

      <form id="registrationForm">

        <div class="form-grid">

          <div class="form-group">
            <label for="memberId">Member ID</label>
            <input
              type="text"
              id="memberId"
              placeholder="Example: POGA001"
              required
            >
          </div>

          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input
              type="text"
              id="fullName"
              placeholder="Full name"
              required
            >
          </div>

          <div class="form-group">
            <label for="passportNumber">Passport Number</label>
            <input
              type="text"
              id="passportNumber"
              placeholder="Passport number"
            >
          </div>

          <div class="form-group">
            <label for="birthday">Birthday</label>
            <input
              type="date"
              id="birthday"
            >
          </div>

          <div class="form-group full-width">
            <label for="address">Address</label>
            <textarea
              id="address"
              rows="3"
              placeholder="Complete address"
            ></textarea>
          </div>

          <div class="form-group">
            <label for="contact">Contact Number</label>
            <input
              type="text"
              id="contact"
              placeholder="Contact number"
            >
          </div>

          <div class="form-group">
            <label for="emergencyContact">
              Emergency Contact Person
            </label>

            <input
              type="text"
              id="emergencyContact"
              placeholder="Name of emergency contact"
            >
          </div>

          <div class="form-group">
            <label for="emergencyNumber">
              Emergency Contact Number
            </label>

            <input
              type="text"
              id="emergencyNumber"
              placeholder="Emergency contact number"
            >
          </div>

          <div class="form-group">
            <label>Membership Status</label>

            <input
              type="text"
              value="Active"
              readonly
              class="readonly-input"
            >
          </div>

          <div class="form-group full-width">

            <label for="photo">
              Member Photo
            </label>

            <input
              type="file"
              id="photo"
              accept="image/*"
            >

            <div id="photoPreview"></div>

            <small>
              Maximum file size: 5MB
            </small>

          </div>

        </div>

        <button
          type="submit"
          id="submitButton"
          class="submit-button"
        >
          Submit Registration
        </button>

      </form>

      <div
        id="successMessage"
        class="success-message hidden"
      >
        <h3>Registration Submitted!</h3>

        <p>
          Your membership registration has been successfully submitted.
        </p>

        <button
          type="button"
          id="registerAnotherButton"
        >
          Register Another Member
        </button>
      </div>

      <div
        id="errorMessage"
        class="error-message hidden"
      ></div>

    </section>

    <footer>
      <p>POGA KSA Member Registration</p>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="registration.js"></script>

</body>
</html>
