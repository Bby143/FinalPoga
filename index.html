<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>POGA KSA Member Registration</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <div class="container">


    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header>

      <h1>POGA KSA</h1>

      <p>
        Member Registration
      </p>

    </header>



    <!-- ========================= -->
    <!-- MEMBER REGISTRATION FORM -->
    <!-- ========================= -->

    <section class="form-section">

      <h2>
        Member Registration
      </h2>

      <p class="form-description">
        Please fill in the information below to register as a POGA KSA member.
      </p>


      <form id="memberForm">

        <div class="form-grid">


          <!-- ========================= -->
          <!-- MEMBER ID -->
          <!-- ========================= -->

          <div class="form-group">

            <label for="memberId">
              Member ID
            </label>

            <input
              type="text"
              id="memberId"
              placeholder="Enter Member ID"
              required
            >

          </div>



          <!-- ========================= -->
          <!-- FULL NAME -->
          <!-- ========================= -->

          <div class="form-group">

            <label for="fullName">
              Full Name
            </label>

            <input
              type="text"
              id="fullName"
              placeholder="Enter Full Name"
              required
            >

          </div>



          <!-- ========================= -->
          <!-- PASSPORT NUMBER -->
          <!-- ========================= -->

          <div class="form-group">

            <label for="passportNumber">
              Passport Number
            </label>

            <input
              type="text"
              id="passportNumber"
              placeholder="Enter Passport Number"
              required
            >

          </div>



          <!-- ========================= -->
          <!-- BIRTHDAY -->
          <!-- ========================= -->

          <div class="form-group">

            <label for="birthday">
              Birthday
            </label>

            <input
              type="date"
              id="birthday"
              required
            >

          </div>



          <!-- ========================= -->
          <!-- COUNTRY -->
          <!-- ========================= -->

          <div class="form-group">

            <label for="country">
              Country
            </label>

            <select
              id="country"
              required
            >

              <option value="">
                Select Country
              </option>

              <option value="Saudi Arabia">
                Saudi Arabia
              </option>

              <option value="Philippines">
                Philippines
              </option>

              <option value="United Arab Emirates">
                United Arab Emirates
              </option>

              <option value="Qatar">
                Qatar
              </option>

              <option value="Kuwait">
                Kuwait
              </option>

              <option value="Bahrain">
                Bahrain
              </option>

              <option value="Oman">
                Oman
              </option>

              <option value="Japan">
                Japan
              </option>

              <option value="South Korea">
                South Korea
              </option>

              <option value="Singapore">
                Singapore
              </option>

              <option value="Malaysia">
                Malaysia
              </option>

              <option value="United States">
                United States
              </option>

              <option value="Canada">
                Canada
              </option>

              <option value="United Kingdom">
                United Kingdom
              </option>

              <option value="Australia">
                Australia
              </option>

              <option value="Other">
                Other
              </option>

            </select>

          </div>



          <!-- ========================= -->
          <!-- ADDRESS / LOCATION -->
          <!-- ========================= -->

          <div class="form-group full-width">

            <label for="address">
              Address / Location
            </label>

            <textarea
              id="address"
              rows="3"
              placeholder="Enter your current address or location"
              required
            ></textarea>

          </div>



          <!-- ========================= -->
          <!-- CONTACT NUMBER -->
          <!-- ========================= -->

          <div class="form-group">

            <label for="contact">
              Contact Number
            </label>

            <input
              type="tel"
              id="contact"
              placeholder="Enter Contact Number"
              required
            >

          </div>



          <!-- ========================= -->
          <!-- EMERGENCY CONTACT PERSON -->
          <!-- ========================= -->

          <div class="form-group">

            <label for="emergencyContact">
              Emergency Contact Person
            </label>

            <input
              type="text"
              id="emergencyContact"
              placeholder="Enter Emergency Contact Person"
              required
            >

          </div>



          <!-- ========================= -->
          <!-- EMERGENCY CONTACT NUMBER -->
          <!-- ========================= -->

          <div class="form-group">

            <label for="emergencyNumber">
              Emergency Contact Number
            </label>

            <input
              type="tel"
              id="emergencyNumber"
              placeholder="Enter Emergency Contact Number"
              required
            >

          </div>



          <!-- ========================= -->
          <!-- MEMBER PHOTO -->
          <!-- ========================= -->

          <div class="form-group full-width">

            <label for="photo">
              Member Photo
            </label>

            <input
              type="file"
              id="photo"
              accept="image/*"
              required
            >

            <small>
              Please upload a clear member photo.
              Maximum file size: 5MB.
            </small>

            <div id="photoPreview"></div>

          </div>


        </div>



        <!-- ========================= -->
        <!-- REGISTER BUTTON -->
        <!-- ========================= -->

        <div class="form-buttons">

          <button
            type="submit"
            id="registerButton"
            class="btn-primary"
          >
            Register Member
          </button>

        </div>


      </form>

    </section>



    <!-- ========================= -->
    <!-- SUCCESS MESSAGE -->
    <!-- ========================= -->

    <div
      id="successMessage"
      class="success-message hidden"
    >

      <strong>
        Registration Successful!
      </strong>

      <p>
        Your POGA KSA member registration has been submitted successfully.
      </p>

      <button
        type="button"
        id="registerAnotherButton"
        class="btn-primary"
      >
        Register Another Member
      </button>

    </div>



    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer class="site-footer">

      <a href="admin.html">
        Admin Login
      </a>

    </footer>


  </div>



  <!-- ========================= -->
  <!-- SUPABASE -->
  <!-- ========================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- ========================= -->
  <!-- REGISTRATION SCRIPT -->
  <!-- ========================= -->

  <script src="script.js"></script>


</body>

</html>
