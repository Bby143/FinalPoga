<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#166534">

  <title>POGA KSA Member Registration</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

<div class="container">

  <header>
    <h1>POGA KSA</h1>
    <p>Member Registration</p>
  </header>


  <!-- ========================= -->
  <!-- MEMBER REGISTRATION -->
  <!-- ========================= -->

  <section class="form-section">

    <h2>Register as a Member</h2>

    <p class="form-description">
      Please complete the form below.
    </p>

    <form id="memberForm">

      <div class="form-grid">

        <div class="form-group">
          <label for="memberId">Member ID</label>

          <input
            type="text"
            id="memberId"
            placeholder="Example: POGA001"
            required
          >
        </div>


        <div class="form-group">
          <label for="fullName">Full Name</label>

          <input
            type="text"
            id="fullName"
            placeholder="Full name"
            required
          >
        </div>


        <div class="form-group">
          <label for="passportNumber">
            Passport Number
          </label>

          <input
            type="text"
            id="passportNumber"
            placeholder="Passport number"
          >
        </div>


        <div class="form-group">
          <label for="birthday">Birthday</label>

          <input
            type="date"
            id="birthday"
          >
        </div>


        <div class="form-group full-width">
          <label for="address">Address</label>

          <textarea
            id="address"
            placeholder="Complete address"
            rows="3"
          ></textarea>
        </div>


        <div class="form-group">
          <label for="contact">
            Contact Number
          </label>

          <input
            type="text"
            id="contact"
            placeholder="Contact number"
          >
        </div>


        <div class="form-group">
          <label for="emergencyContact">
            Emergency Contact Person
          </label>

          <input
            type="text"
            id="emergencyContact"
            placeholder="Name of emergency contact"
          >
        </div>


        <div class="form-group">
          <label for="emergencyNumber">
            Emergency Contact Number
          </label>

          <input
            type="text"
            id="emergencyNumber"
            placeholder="Emergency contact number"
          >
        </div>


        <!-- PHOTO -->

        <div class="form-group full-width">

          <label for="photo">
            Member Photo
          </label>

          <input
            type="file"
            id="photo"
            accept="image/*"
          >

          <small>
            Maximum photo size: 5 MB
          </small>

          <div id="photoPreview"></div>

        </div>

      </div>


      <div class="form-buttons">

        <button
          type="submit"
          id="saveButton"
          class="btn-primary"
        >
          Submit Registration
        </button>

        <button
          type="reset"
          id="cancelButton"
          class="btn-secondary"
        >
          Clear
        </button>

      </div>

    </form>

  </section>


  <!-- ========================= -->
  <!-- SUCCESS MESSAGE -->
  <!-- ========================= -->

  <div
    id="successMessage"
    class="success-message hidden"
  >
    <strong>Registration successful!</strong>

    <p>
      Your member registration has been submitted.
    </p>

    <button
      type="button"
      id="newRegistrationButton"
      class="btn-primary"
    >
      Register Another Member
    </button>
  </div>


  <footer class="site-footer">

    <a href="admin.html">
      Admin Login
    </a>

  </footer>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- PUBLIC REGISTRATION SCRIPT -->

<script src="script.js"></script>

</body>
</html>
